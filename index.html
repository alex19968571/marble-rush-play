<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <!-- 手機全螢幕：禁止縮放；加入主畫面後以全螢幕 App 形式開啟 -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Marble Rush">
    <title>Marble Rush</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #07061a;
                   overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #unity-canvas { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; display: block;
                      background: #07061a; touch-action: none; outline: none; }
      #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                gap: 18px; color: #fff; font: 600 18px -apple-system, "PingFang TC", sans-serif; background: #07061a; z-index: 2; }
      #loader h1 { margin: 0; font-size: 34px; letter-spacing: 3px; color: #fff;
                   text-shadow: 0 0 8px #ff3ec8, 0 0 20px #ff3ec8; }
      #bar { width: 64vw; height: 10px; border-radius: 5px; background: #1c1840; box-shadow: 0 0 10px #3ee8ff55 inset; overflow: hidden; }
      #fill { width: 0%; height: 100%; background: linear-gradient(90deg, #3ee8ff, #ff3ec8); box-shadow: 0 0 12px #3ee8ff; transition: width .2s; }
      #msg { max-width: 86vw; text-align: center; font-size: 14px; color: #c8c4ff; line-height: 1.5; }
      #msg.error { color: #ff7a9c; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loader">
      <h1>MARBLE RUSH</h1>
      <div id="bar"><div id="fill"></div></div>
      <div id="msg">載入中…（第一次開啟需下載約數十 MB，請使用 Wi-Fi）</div>
    </div>
    <script src="Build/WebGL.loader.js"></script>
    <script>
      (function () {
        var canvas = document.querySelector("#unity-canvas");
        var loader = document.querySelector("#loader");
        var fill   = document.querySelector("#fill");
        var msg    = document.querySelector("#msg");

        function showError(text) {
          loader.style.display = "flex";
          msg.className = "error";
          msg.textContent = "啟動失敗：" + text;
        }

        // iOS Safari 的 100vh 含網址列：以實際可視高度設定畫布，旋轉／網址列伸縮時同步
        function fit() {
          canvas.style.width  = window.innerWidth + "px";
          canvas.style.height = window.innerHeight + "px";
        }
        window.addEventListener("resize", fit);
        window.addEventListener("orientationchange", function () { setTimeout(fit, 300); });
        fit();

        // 阻止雙指縮放與頁面回彈，避免操作 PUSH 時整頁晃動
        document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
        document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });

        createUnityInstance(canvas, {
          dataUrl: "Build/WebGL.data",
          frameworkUrl: "Build/WebGL.framework.js",
          codeUrl: "Build/WebGL.wasm",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "DefaultCompany",
          productName: "Marble Rush",
          productVersion: "1.0",
          // iPhone 原生 3 倍像素：限制為 2 倍，降低 GPU 負擔、維持幀率
          devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        }, function (progress) {
          fill.style.width = Math.round(progress * 100) + "%";
        }).then(function () {
          loader.style.display = "none";
        }).catch(function (err) {
          showError(err && err.message ? err.message : String(err));
        });
      })();
    </script>
  </body>
</html>
